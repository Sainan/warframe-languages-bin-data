name: Update
on:
  workflow_dispatch: {}
jobs:
  update:
    runs-on: [debian-10]
    steps:
      - run: rm -rf warframe-languages-bin-data warframe-cache-tools
      - run: git clone https://github.com/calamity-inc/warframe-languages-bin-data
      - run: git clone https://github.com/Sainan/warframe-cache-tools
      - name: Run _update.pluto
        run: |
          cd warframe-languages-bin-data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          pluto _update.pluto
      - uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          directory: warframe-languages-bin-data
